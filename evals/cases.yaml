# Eval cases for the setlist.fm MCP server.
#
# Each case is one question a user might ask Claude, plus what "correct" means:
#
#   id:        unique, stable slug (results are keyed by it; don't rename after running)
#   prompt:    the user message, exactly as sent to Claude
#   tags:      first tag = the group shown in summaries; the rest are labels
#   expected:
#     artist_name:  the artist the tool must be called with (case-insensitive)
#     compact_mode: true/false if the tool calls should use it; omit to not grade it
#     reference:    the ground-truth answer, given to the judge. Any shape; keep it
#                   factual. Generate it from the live data with
#                   evals/ground_truth.py rather than from memory, then check it.
#                   Describe the data, not where it sits: setlists are paged newest
#                   first, so new concerts keep moving older ones to later pages.
#     notes:        optional extra guidance for the judge (what's acceptable)

- id: national-countries-2025
  prompt: "Which countries did The National play in in 2025?"
  tags: [where-played, empty-result]
  expected:
    artist_name: The National
    compact_mode: true
    reference:
      year: 2025
      countries: []
    notes: >-
      setlist.fm has no The National shows in 2025: the most recent setlists are
      two in October 2026, preceded by October 2024. A correct answer says no 2025
      shows are recorded and names no 2025 countries. Mentioning 2024 or 2026 shows
      for context is fine if they are clearly attributed to those years.

- id: tame-impala-countries-2025
  prompt: "Which countries did Tame Impala play in in 2025?"
  tags: [where-played, multi-page]
  expected:
    artist_name: Tame Impala
    compact_mode: true
    reference:
      year: 2025
      countries:
        - Australia      # 3 shows (Dec: Sydney, Melbourne, Brisbane)
        - Mexico         # 1 show (Oct: Naucalpan)
        - Spain          # 2 shows (Jun: Barcelona)
        - United States  # 14 shows (Sep-Nov, incl. the Deadbeat tour)
    notes: >-
      20 shows in 2025 across exactly these four countries. Several pages of 2026 shows
      come first, so stopping before reaching the start of 2025 misses Spain (June) and
      Mexico (October). Listing any other country for 2025 is wrong. Mentioning 2026
      shows is fine if clearly attributed to 2026.

- id: mogwai-top-three-songs-q1-2025
  prompt: "Which three songs did Mogwai play most in Q1 2025, and how many times each?"
  tags: [song-stats, multi-page, full-mode, date-range]
  expected:
    artist_name: Mogwai
    # compact_mode not graded: songs need full mode, but a compact call first to find
    # which pages hold Q1 2025 is a sensible (cheaper) strategy, not a mistake.
    reference:
      period: 2025-01-01 to 2025-03-31
      shows: 25                          # 26 Jan (Glasgow) to 28 Mar (Manchester); no song played twice in a show
      most_played:
        - Hi Chaos: 25                   # every Q1 show
        - Lion Rumpus: 24                # tied for second
        - Fanzine Made of Flesh: 24      # tied for second (missed Paris, 19 Feb)
      next:
        - God Gets You Back: 23
        - Ritchie Sacramento: 22
    notes: >-
      The Q1 2025 shows come after several pages of later shows, and the quarter
      starts and ends mid-page, so the model has to filter by date. Only full mode
      includes songs. A correct answer names Hi Chaos (25), Lion Rumpus (24) and Fanzine Made of
      Flesh (24) with exactly these counts; the two 24s may come in either order, and
      saying they are tied is good but not required. Approximate or hedged counts are
      wrong: the assistant had the same data. Missing the Manchester show gives Hi
      Chaos 24, which is wrong. Including shows from outside Q1 is wrong. "Times played"
      and "shows played at" are the same here. Listing further songs is fine if their
      counts don't contradict the reference.
