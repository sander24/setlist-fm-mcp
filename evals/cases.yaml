# Eval cases for the setlist.fm MCP server.
#
# Each case is one question a user might ask Claude, plus what "correct" means:
#
#   id:        unique, stable slug (results are keyed by it; don't rename after running)
#   prompt:    the user message, exactly as sent to Claude
#   tags:      first tag = the group shown in summaries; the rest are labels
#   expected:
#     artist_name:  the artist the tool must be called with (case-insensitive)
#     compact_mode: true/false if the tool calls should use it; omit to not grade it
#     reference:    the ground-truth answer, given to the judge. Any shape; keep it
#                   factual. Generate it from the live data with
#                   evals/ground_truth.py rather than from memory, then check it.
#                   Describe the data, not where it sits: setlists are paged newest
#                   first, so new concerts keep moving older ones to later pages.
#     notes:        optional extra guidance for the judge (what's acceptable)

- id: national-countries-2025
  prompt: "Which countries did The National play in in 2025?"
  tags: [where-played, empty-result]
  expected:
    artist_name: The National
    compact_mode: true
    reference:
      year: 2025
      countries: []
    notes: >-
      setlist.fm has no The National shows in 2025: the most recent setlists are
      two in October 2026, preceded by October 2024. A correct answer says no 2025
      shows are recorded and names no 2025 countries. Mentioning 2024 or 2026 shows
      for context is fine if they are clearly attributed to those years.

- id: tame-impala-countries-2025
  prompt: "Which countries did Tame Impala play in in 2025?"
  tags: [where-played, multi-page]
  expected:
    artist_name: Tame Impala
    compact_mode: true
    reference:
      year: 2025
      countries:
        - Australia: "3 shows (December: Sydney, Melbourne, Brisbane)"
        - Mexico: "1 show (October: Naucalpan)"
        - Spain: "2 shows (June: Barcelona)"
        - United States: "14 shows (September to November, incl. the Deadbeat tour)"
    notes: >-
      20 shows in 2025 across exactly these four countries. Several pages of 2026 shows
      come first, so stopping before reaching the start of 2025 misses Spain (June) and
      Mexico (October). Listing any other country for 2025 is wrong. Mentioning 2026
      shows is fine if clearly attributed to 2026.

- id: mogwai-top-three-songs-q1-2025
  prompt: "Which three songs did Mogwai play most in Q1 2025, and how many times each?"
  tags: [song-stats, multi-page, full-mode, date-range]
  expected:
    artist_name: Mogwai
    # compact_mode not graded: songs need full mode, but a compact call first to find
    # which pages hold Q1 2025 is a sensible (cheaper) strategy, not a mistake.
    reference:
      period: 2025-01-01 to 2025-03-31
      shows: 25                          # 26 Jan (Glasgow) to 28 Mar (Manchester); no song played twice in a show
      most_played:
        - Hi Chaos: 25                   # every Q1 show
        - Lion Rumpus: 24                # tied for second
        - Fanzine Made of Flesh: 24      # tied for second (missed Paris, 19 Feb)
      next:
        - God Gets You Back: 23
        - Ritchie Sacramento: 22
    notes: >-
      The Q1 2025 shows come after several pages of later shows, and the quarter
      starts and ends mid-page, so the model has to filter by date. Only full mode
      includes songs. A correct answer names Hi Chaos (25), Lion Rumpus (24) and Fanzine Made of
      Flesh (24) with exactly these counts; the two 24s may come in either order, and
      saying they are tied is good but not required. Approximate or hedged counts are
      wrong: the assistant had the same data. Missing the Manchester show gives Hi
      Chaos 24, which is wrong. Including shows from outside Q1 is wrong. "Times played"
      and "shows played at" are the same here. Listing further songs is fine if their
      counts don't contradict the reference.

- id: tame-impala-spain-count-2025
  prompt: "How many times did Tame Impala play in Spain in 2025?"
  tags: [where-played, multi-page, country-filter]
  expected:
    artist_name: Tame Impala
    compact_mode: true
    reference:
      count: 2
      year: 2025
      shows:
        - 06-06-2025: Parc del Fòrum, Barcelona   # Primavera Sound, 11 songs
        - 07-06-2025: Nitsa, Barcelona            # club show, 5 songs
    notes: >-
      Two shows in 2025, both in Barcelona, on 6 and 7 June. 2 is correct. The 7 June
      show at Nitsa (a club, 5 songs listed) may have been a DJ or club set, so an answer
      that counts the 6 June show and describes the Nitsa show separately is also
      correct, as long as it mentions both. 1 with no mention of Nitsa is wrong.
      Tame Impala also played Spain in April 2026 (Madrid, 7 Apr; Barcelona, 8 Apr), and
      those shows come first in the results, so 4, or any count that includes them, is
      wrong. Mentioning them is fine if clearly attributed to 2026.

- id: rolling-stones-germany-2024
  prompt: "How many times did The Rolling Stones play in Germany in 2024?"
  tags: [where-played, empty-result, country-filter]
  expected:
    artist_name: The Rolling Stones
    compact_mode: true
    reference:
      count: 0
      year: 2024
      shows_in_2024: 20
      tour: Hackney Diamonds, 28 Apr to 21 Jul 2024
      countries_in_2024:
        - United States: 19 shows
        - Canada: "1 show (Vancouver, 5 Jul)"
    notes: >-
      0 is correct: all 20 of their 2024 shows (the Hackney Diamonds tour, April to July)
      were in North America. They do play Germany regularly, most recently in 2022 on
      the Sixty tour (Munich, 5 Jun; Gelsenkirchen, 27 Jul; Berlin, 3 Aug), so counting
      those or any other year's German shows is wrong. Mentioning them is fine if
      clearly attributed to that year. Saying the artist couldn't be found is wrong.

- id: genialistid-last-concert
  prompt: "Where did Genialistid play their last concert?"
  tags: [last-concert, no-year]
  expected:
    artist_name: Genialistid
    compact_mode: true
    reference:
      date: 05-07-2024
      venue: Tartu Laululava
      city: Tartu
      country: Estonia
      setlists_on_setlist_fm: 2
      other_setlist: 26-08-2006, Tallinna Lauluväljak, Tallinn
    notes: >-
      The most recent setlist on setlist.fm is 5 July 2024 at Tartu Laululava in Tartu,
      Estonia, and that is the correct answer. setlist.fm has only two setlists for this
      band, so noting that its coverage may be incomplete, or that this is the last
      concert setlist.fm knows of, is fine. Naming a different venue or date as the
      answer is wrong, even with a caveat. The question has no year: the answer must
      not depend on assuming one.

- id: unknown-artist-metallica-gangsta-rap-big-band
  prompt: "How many concerts did Metallica Gangsta Rap Big Band play in 2025?"
  tags: [unknown-artist, empty-result]
  expected:
    artist_name: Metallica Gangsta Rap Big Band
    reference:
      artist_on_setlist_fm: none
      concerts_reported: none
      note: >-
        setlist.fm's artist search returns no results for this name, or for parts of
        it ("Metallica Gangsta", "Gangsta Rap Big Band", "Big Band Metallica").
    notes: >-
      Correct: setlist.fm has no artist by this name, so no concerts can be reported.
      Wrong: reporting any number of concerts, including 0, as this band's actual
      count, or reporting Metallica's concerts as this band's. Offering to look up
      Metallica, or giving Metallica's figures clearly labelled as a different band, is
      fine. Saying the name may be misspelled or may not be listed on setlist.fm is fine.

- id: my-dying-bride-gigs-2023-2024
  prompt: "How many gigs did My Dying Bride play in each of 2023 and 2024?"
  tags: [count, several-years, multi-page]
  expected:
    artist_name: My Dying Bride
    compact_mode: true
    reference:
      "2023": "7 gigs: Dessel (15 Jun), Horten (19 Aug), Balve (8 Sep), Aleksandrów Łódzki (9 Sep), Würzburg (18 Nov), London (1 Dec), Bradford (14 Dec)"
      "2024": "2 gigs: both on the cruise ship Freedom of the Seas from Miami (30 Jan, 1 Feb)"
      neighbouring_years: "2022: 2 gigs; 2025: 17 gigs"
    notes: >-
      Correct: 7 in 2023 and 2 in 2024. Giving the combined total (9) as well is fine.
      Both numbers must be exact and attributed to the right year: the last 2023 gig
      (14 Dec) and the first 2024 gig (30 Jan) are close, so 6 and 3, or 8 and 1, is
      wrong even though the total is 9. Counting only the 2023 gigs, or only the 2024
      ones, is wrong. Including any 2022 or 2025 gigs is wrong; 2025 has 17 and they come
      first in the results. The two 2024 gigs were on a cruise ship: counting them as two
      gigs is correct, and as one event is wrong unless the answer says there were two
      performances.
